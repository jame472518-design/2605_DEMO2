# demo2 規則設定。Plugin 啟動時讀,改完要重啟 plugin(W2 暫不做 hot-reload)。
#
# 每條 rule:
#   id        : 唯一 ID,也是 alert.rule 的值
#   severity  : info | warn | critical
#   when      : 條件,兩種寫法
#                a. 單一條件:{ metric, op, value, window_s? }
#                   - 沒給 window_s → 看當下 frame
#                   - 給 window_s   → 條件需連續為真 window_s 秒
#                b. 複合條件(同時用):
#                      all: [簡單條件...]   AND
#                      any: [簡單條件...]   OR
#   actuator  : 規則 fire 時送給 Arduino 的命令(可省略)
#                { device: buzzer|led, state, duration_ms? }
#
# 支援的 op:>, <, >=, <=, ==, !=

rules:
  # heat_sustained:DHT11 ±2°C 誤差,所以閾值 32 比 30 安全(28°C 室溫不會誤觸)。
  # 用體溫貼住 sensor 30 秒就會 fire,booth demo 容易觸發。
  - id: heat_sustained
    severity: warn
    when: { metric: temp_c, op: ">", value: 32, window_s: 60 }
    actuator: { device: buzzer, state: "on", duration_ms: 1500 }

  - id: night_intrusion
    severity: critical
    when:
      all:
        - { metric: pir, op: "==", value: 1 }
        - { metric: lux_raw, op: "<", value: 50 }
    actuator: { device: led, state: "red" }

  - id: object_too_close
    severity: info
    when: { metric: distance_cm, op: "<", value: 15, window_s: 3 }
